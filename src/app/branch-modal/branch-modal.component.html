<div class="modal-body" style="display: flex; flex-direction: column; align-items: stretch; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 20px;">
  <div class="modal-header" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #f7f7f7; border-bottom: 1px solid #ccc; position: sticky; top: 0; z-index: 1;">
    <h5 class="modal-title" style="margin: 0; font-size: 1.5em;">Code Differences</h5>
    <button type="button" class="close" (click)="closeModal()" style="background: none; border: none; font-size: 1.5em; cursor: pointer; z-index: 2;">
      <span>&times;</span>
    </button>
  </div>
  <div class="modal-content" style="background-color: #f7f7f7; height: calc(100% - 60px); overflow: auto; padding: 20px; border-radius: 10px; width: 100%;">
    <div class="modal-inner-content" style="padding: 20px;">
      <div class="fixes-container" style="display: flex; gap: 20px; width: 100%; height: 100%; overflow: auto;">
        <div class="fix-container before" style="background-color: #F7EED4; width: 48%; padding: 15px; border: 1px solid #ccc; border-radius: 5px; overflow: auto; box-sizing: border-box; height: 70vh;">
          <h6 style="margin-top: 0; font-size: 1.2em;">Before Fix</h6>
          <pre style="white-space: pre-wrap; word-wrap: break-word; font-family: monospace; font-size: 1em; line-height: 1.5;" [innerHTML]="diffResultBefore"></pre>
        </div>
        <div class="fix-container after" style="background-color: #F7EED4; width: 48%; padding: 15px; border: 1px solid #ccc; border-radius: 5px; overflow: auto; box-sizing: border-box; height: 70vh;">
          <h6 style="margin-top: 0; font-size: 1.2em;">After Fix</h6>
          <pre style="white-space: pre-wrap; word-wrap: break-word; font-family: monospace; font-size: 1em; line-height: 1.5;" [innerHTML]="diffResultAfter"></pre>
        </div>
      </div>
    </div>
  </div>
</div>
<div mat-dialog-actions style="display: flex; justify-content: center; padding: 10px;">
  <button mat-button (click)="closeModal()" routerLink="/status" style="font-size: 1.2em; background-color: #007bff; color: white; padding: 10px 20px; border-radius: 5px;">Apply Fix</button>
</div>
